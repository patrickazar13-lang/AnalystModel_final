name: Live Model + Excel

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker"
        required: true
        default: "LH-US"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run live model
        env:
          FACTSET_CLIENT_ID: ${{ secrets.FACTSET_CLIENT_ID }}
          FACTSET_CLIENT_SECRET: ${{ secrets.FACTSET_CLIENT_SECRET }}
        run: |
          python master_pipeline.py --live --ticker "${{ inputs.ticker }}"

      - name: Build Excel workbook
        run: |
          python export_to_excel.py --ticker "${{ inputs.ticker }}"

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ github.run_id }}
          path: outputs/
