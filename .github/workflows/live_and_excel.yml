name: Live Model + Excel

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (needs the exchange suffix, e.g. RGTI-US)"
        required: true
        default: "LH-US"
      quarters:
        description: "How many trailing quarters of data to pull"
        required: true
        default: "12"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run live model
        env:
          FACTSET_CLIENT_ID: ${{ secrets.FACTSET_CLIENT_ID }}
          FACTSET_CLIENT_SECRET: ${{ secrets.FACTSET_CLIENT_SECRET }}
        run: |
          # --min-factor-obs 6 is the lowest this can go: the FF3+MOM factor
          # regression needs at least 6 quarterly observations (4 factors +
          # intercept) to run at all. Even at 6, treat any resulting
          # factor_alpha as noisy -- the Factor-Adjusted Score sheet's
          # t-stat column shows how much to trust each one.
          python master_pipeline.py --live --ticker "${{ inputs.ticker }}" --quarters "${{ inputs.quarters }}" --factor-adjusted --min-factor-obs 6

      - name: Build Excel workbook
        run: |
          python export_to_excel.py --ticker "${{ inputs.ticker }}"

      - name: Save the pulled CSVs back to the repo (so you don't have to re-pull next time)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "--- New/changed files git can see under outputs/ before staging ---"
          git status --porcelain outputs/ || echo "(git status itself failed -- see above)"

          echo "--- Running git add ---"
          # Just outputs/*.csv -- every CSV this project writes lives flat
          # in outputs/, never nested in a subfolder, so a "**" pathspec
          # was never needed. It's also actively harmful: git add fails
          # ATOMICALLY across every pathspec it's given -- if outputs/**/*.csv
          # matches nothing (which it never will, no CSV is ever nested),
          # git add stages NOTHING AT ALL, not even the files outputs/*.csv
          # matched just fine. That silent all-or-nothing failure, masked by
          # the old "2>/dev/null || true", is why tickers stopped saving.
          git add outputs/*.csv

          echo "--- What actually got staged ---"
          git status --porcelain --untracked-files=no outputs/

          if git diff --cached --quiet; then
            echo "Nothing staged -- nothing to commit. If you expected new files here, "
            echo "that means git add (above) didn't find/accept them; check its output for errors."
          else
            git commit -m "Update outputs from Live Model + Excel run (${{ inputs.ticker }})"
            git push
          fi

      - name: Work out this ticker's Excel filename
        id: xlsx
        run: |
          SAFE=$(echo "${{ inputs.ticker }}" | tr '-' '_')
          echo "path=outputs/live_${SAFE}_model.xlsx" >> "$GITHUB_OUTPUT"

      - name: Upload just the Excel file
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ inputs.ticker }}
          path: ${{ steps.xlsx.outputs.path }}
          retention-days: 30
          overwrite: true
