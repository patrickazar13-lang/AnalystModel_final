name: Run Analyst Model

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which script to run"
        required: true
        type: choice
        options:
          - master_pipeline.py
          - export_to_excel.py
          - smart_consensus.py
          - export_smart_consensus.py
        default: master_pipeline.py

      args:
        description: "Exact command-line flags, same as you'd type locally (e.g. --live --ticker CME-US --quarters 12)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Mark the time before we run anything
        run: echo "RUN_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run ${{ inputs.script }}
        env:
          FACTSET_CLIENT_ID: ${{ secrets.FACTSET_CLIENT_ID }}
          FACTSET_CLIENT_SECRET: ${{ secrets.FACTSET_CLIENT_SECRET }}
        run: python ${{ inputs.script }} ${{ inputs.args }}

      - name: Save new/changed outputs back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Just outputs/*.csv -- every CSV this project writes lives flat
          # in outputs/, never nested in a subfolder. The old
          # "outputs/**/*.csv" pathspec never matched anything, and because
          # git add fails ATOMICALLY across all its pathspecs, that one
          # always-failing pattern silently blocked outputs/*.csv from
          # staging ANYTHING too -- masked by the old "2>/dev/null || true".
          git add outputs/*.csv

          if git diff --cached --quiet; then
            echo "Nothing staged -- nothing to commit this run."
          else
            git commit -m "Update outputs from Actions run (${{ inputs.script }} ${{ inputs.args }})"
            git push
          fi

      - name: Figure out which file(s) this run actually produced
        id: newfiles
        run: |
          # Anything under outputs/ whose contents changed after RUN_START.
          # A marker file's timestamp is used instead of raw "date" math,
          # since checking out the repo can leave stale mtimes on files
          # that weren't touched by this run.
          touch -d "@$RUN_START" /tmp/run_marker
          NEW_FILES=$(find outputs -type f -newer /tmp/run_marker)
          if [ -z "$NEW_FILES" ]; then
            echo "No new/changed files detected under outputs/ -- nothing will be uploaded."
          fi
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Work out a name for this download
        id: label
        run: |
          # Pull the ticker out of the --ticker flag if there is one, so
          # running the SAME ticker again reuses the SAME download name
          # (and, combined with overwrite: true below, replaces the old
          # one instead of piling up a new zip every time).
          TICKER=$(echo "${{ inputs.args }}" | grep -oP '(?<=--ticker[= ])\S+' || true)
          SCRIPT_NAME=$(basename "${{ inputs.script }}" .py)
          if [ -n "$TICKER" ]; then
            echo "name=${SCRIPT_NAME}-${TICKER}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${SCRIPT_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload just this run's file(s)
        if: steps.newfiles.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.label.outputs.name }}
          path: ${{ steps.newfiles.outputs.files }}
          retention-days: 30
          overwrite: true
