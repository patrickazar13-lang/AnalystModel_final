name: Export Ticker to Excel

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Ticker (needs the exchange suffix, e.g. AAPL-US)"
        required: true
        default: "AAPL-US"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the organized Excel workbook for this ticker (0 FactSet/API calls -- uses the CSVs already in outputs/)
        run: |
          python export_to_excel.py --ticker "${{ inputs.ticker }}"

      - name: Work out this ticker's Excel filename
        id: xlsx
        run: |
          SAFE=$(echo "${{ inputs.ticker }}" | tr '-' '_')
          echo "path=outputs/live_${SAFE}_model.xlsx" >> "$GITHUB_OUTPUT"

      - name: Upload the Excel file
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ inputs.ticker }}
          path: ${{ steps.xlsx.outputs.path }}
          retention-days: 30
          overwrite: true
